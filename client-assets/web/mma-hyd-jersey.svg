<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 268" role="img" aria-label="MMA HYD jersey structured artwork">
  <!--
    Structured web SVG for the MMA HYD jersey.
    Customizable regions: body, collar, leftSleeve, rightSleeve, pattern.
    Fixed graphics: crest, HYDERABAD, APFC, iFL, 12R, UFC FIGHT PASS.
    This file is the static source. The live configurator uses src/components/ClientJerseySvg.tsx.
    Logos/text are SVG approximations of client artwork because CorelDRAW vectors could not be converted.
  -->
  <defs>
    <linearGradient id="fabric" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="mesh" width="14" height="24" patternUnits="userSpaceOnUse">
      <path d="M7 1.4 L13.2 5.2 V12.8 L7 16.6 L0.8 12.8 V5.2 Z" fill="none" stroke="#3C5841" stroke-width="0.75"/>
    </pattern>
  </defs>
  <g id="leftSleeve">
    <path d="M51.5 56C30 62 15 78 11 96C7.5 111 12 124 24.5 128C35 132 45 125 50 110C53 95 53 74 51.5 56Z" fill="#303E2D"/>
  </g>
  <g id="rightSleeve">
    <path d="M148.5 56C170 62 185 78 189 96C192.5 111 188 124 175.5 128C165 132 155 125 150 110C147 95 147 74 148.5 56Z" fill="#303E2D"/>
  </g>
  <g id="body">
    <path d="M51.5 56L72 40L84 58C90 72 95 80 100 80C105 80 110 72 116 58L128 40L148.5 56C151 88 153 138 153.5 176L151.5 230C151.5 242 129 250 100 250C71 250 48.5 242 48.5 230L46.5 176C47 138 49 88 51.5 56Z" fill="#303E2D"/>
  </g>
  <g id="pattern">
    <path d="M86 86C92 96 96 108 100 108C104 108 108 96 114 86C118 102 122 150 122 186C122 214 112 236 100 236C88 236 78 214 78 186C78 150 82 102 86 86Z" fill="#3C5841"/>
    <path d="M86 86C92 96 96 108 100 108C104 108 108 96 114 86C118 102 122 150 122 186C122 214 112 236 100 236C88 236 78 214 78 186C78 150 82 102 86 86Z" fill="url(#mesh)"/>
  </g>
  <g id="collar">
    <path d="M72 40C78 28 122 28 128 40L118 52C114 44 106 40 100 40C94 40 86 44 82 52Z" fill="#26352A"/>
    <path d="M82 52C88 66 94 80 100 80C106 80 112 66 118 52C112 58 106 62 100 62C94 62 88 58 82 52Z" fill="#26352A"/>
  </g>
  <g id="fixedGraphics">
    <g id="logos">
      <g transform="translate(100 96)">
        <path d="M0 -15 L13 -11 L11 5C11 12 0 18 0 18C0 18 -11 12 -11 5L-13 -11Z" fill="#1c1c1c" stroke="#d4d4d8" stroke-width="1.15"/>
      </g>
    </g>
    <g id="text">
      <text x="100" y="128" text-anchor="middle" fill="#fff" font-family="Arial Black, sans-serif" font-size="11.5" letter-spacing="1.6">HYDERABAD</text>
      <text x="64" y="232" text-anchor="middle" fill="#fff" font-size="6.2" font-weight="700">APFC</text>
      <text x="136" y="230" text-anchor="middle" fill="#fff" font-size="8" font-style="italic" font-weight="700">iFL</text>
    </g>
    <g id="sponsors">
      <text x="100" y="226" text-anchor="middle" fill="#E23B2B" font-size="11" font-weight="800">UFC</text>
      <text x="100" y="236" text-anchor="middle" fill="#fff" font-size="6.5" font-weight="700">FIGHT PASS</text>
    </g>
  </g>
</svg>
